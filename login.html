<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Continue | KredRun</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/account.css">
  <style>
    .auth-main-simple{min-height:calc(100vh - 78px);display:grid;align-items:center;padding:34px 0 54px}
    .auth-layout-simple{display:block;max-width:470px;margin:0 auto}
    .auth-layout-simple .auth-card{padding:30px;border-radius:20px}
    .auth-simple-head{margin-bottom:20px}
    .auth-simple-head h1{font-size:clamp(1.8rem,5vw,2.35rem);line-height:1.08;margin:0 0 6px;letter-spacing:-.035em}
    .auth-simple-head p{margin:0;color:#667681;font-size:.92rem}
    .login-boot-state{min-height:32px;display:flex;align-items:center;gap:10px;color:#667681;font-size:.84rem;margin-top:12px}
    .login-boot-dot{width:9px;height:9px;border-radius:50%;background:var(--brand-primary,#0876d8);box-shadow:0 0 0 0 rgba(8,118,216,.28);animation:loginPulse 1.2s infinite;flex:0 0 auto}
    .login-waiting-form .btn[disabled]{opacity:.7;cursor:wait}
    @keyframes loginPulse{70%{box-shadow:0 0 0 10px rgba(8,118,216,0)}100%{box-shadow:0 0 0 0 rgba(8,118,216,0)}}
    @media(max-width:640px){.auth-main-simple{align-items:start;padding:22px 0 44px}.auth-layout-simple .auth-card{padding:20px}}
  </style>
</head>
<body class="auth-page" data-auth-page="login">
  <div data-site-header></div>
  <main class="auth-main auth-main-simple">
    <div class="container auth-layout auth-layout-simple">
      <section class="auth-card auth-card-identity">
        <div class="auth-simple-head">
          <h1>Continue</h1>
          <p>Enter your South African ID number.</p>
        </div>
        <div data-login-identity-auth>
          <form class="login-waiting-form" data-login-waiting-form>
            <div class="auth-field">
              <label>South African ID number</label>
              <input name="idNumber" inputmode="numeric" autocomplete="off" maxlength="13" pattern="[0-9]{13}" placeholder="13 digits" required autofocus>
            </div>
            <button class="btn btn-primary btn-wide" type="submit" disabled aria-disabled="true">Getting login ready…</button>
          </form>
          <div class="login-boot-state" role="status" aria-live="polite"><span class="login-boot-dot" aria-hidden="true"></span><span>Securing your login…</span></div>
          <noscript><div class="auth-feedback show error" role="alert">JavaScript is required to log in.</div></noscript>
        </div>
      </section>
    </div>
  </main>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/supabase-config.js?v=20260902-1"></script>
  <script src="assets/js/production-hardening.js?v=20260902-1"></script>
  <script src="assets/js/login-bootstrap.js?v=20260902-1"></script>
</body>
</html>
